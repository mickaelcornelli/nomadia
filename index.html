<!doctype html>
<html lang="fr">
  <head>
    <!-- Charset & Responsive -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      Nomadia — Plateforme de voyage, découverte et réservation
    </title>

    <meta
      name="description"
      content="Nomadia est une plateforme moderne de voyage permettant de découvrir des destinations, organiser vos aventures et réserver vos prochains séjours facilement."
    />

    <meta
      name="keywords"
      content="voyage, tourisme, réservation, destinations, aventure, vacances, roadtrip, billets, hôtels, Nomadia"
    />

    <meta name="author" content="Nomadia" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="fr" />
    <meta name="theme-color" content="#0A84FF" />

    <!-- Canonical -->
    <link rel="canonical" href="https://nomadia.fr/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nomadia" />
    <meta
      property="og:title"
      content="Nomadia — Explorez le monde autrement"
    />
    <meta
      property="og:description"
      content="Découvrez des destinations uniques, préparez vos voyages et vivez de nouvelles aventures avec Nomadia."
    />
    <meta property="og:url" content="https://nomadia.fr/" />
    <meta property="og:image" content="https://nomadia.fr/og-cover.jpg" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nomadia" />
    <meta
      name="twitter:description"
      content="Explorez le monde autrement avec Nomadia."
    />
    <meta
      name="twitter:image"
      content="https://nomadia.fr/og-cover.jpg"
    />

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Nomadia" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Nomadia",
        "url": "https://nomadia.fr",
        "logo": "https://nomadia.fr/logo.png",
        "description": "Plateforme moderne de voyage et découverte de destinations.",
        "sameAs": [
          "https://instagram.com/nomadia",
          "https://twitter.com/nomadia",
          "https://facebook.com/nomadia"
        ]
      }
    </script>
  </head>

  <body>
    <noscript>
      Vous devez activer JavaScript pour utiliser Nomadia.
    </noscript>

    <div id="root"></div>

    <!-- Main React App -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
